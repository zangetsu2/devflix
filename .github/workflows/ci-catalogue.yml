name: CI - Catalogue

on:
  push:
    paths:
      - 'catalogue/**'
  pull_request:
    paths:
      - 'catalogue/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          cd catalogue
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd catalogue
          pytest
